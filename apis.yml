aid: habitus-associates-co-ltd
name: Habitus Associates Co., Ltd.
description: >-
  Habitus Associates Co., Ltd. is the company behind Artue (artue.io), an
  AI-powered online marketplace for original artworks by Korean and
  international artists. Artue lets collectors discover, purchase, and resell
  paintings, photography, sculptures, and prints, with natural-language search
  that finds works by mood, color, style, room type, or budget. The platform is
  explicitly agent-native: it publishes an llms.txt and ships a hosted Model
  Context Protocol (MCP) server so AI assistants such as Claude and ChatGPT can
  search its collection directly. Backed by 500 Global and surfaced into the API
  Evangelist network from that portfolio.
